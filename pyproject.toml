[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-safety-lidar-vision"
version = "1.0.0"
description = "Construction-site safety monitor: a YOLO PPE detector with per-worker compliance rules on camera images, and a RANSAC + DBSCAN LiDAR pipeline that raises danger-zone alerts, evaluated on Roboflow Construction Site Safety and Argoverse 2."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Muhammad Haroon Khan" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "opencv-python>=4.9",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "tqdm>=4.66",
    "pillow>=10",
]

[project.optional-dependencies]
camera = ["ultralytics>=8.3", "torch>=2.2", "kaggle>=1.6"]
open3d = ["open3d>=0.19"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cs-download-ppe = "sitesafety.download:ppe_main"
cs-download-lidar = "sitesafety.download:lidar_main"
cs-check-ppe = "sitesafety.ppe_data:main"
cs-train-ppe = "sitesafety.train_ppe:main"
cs-eval-ppe = "sitesafety.evaluate_ppe:main"
cs-detect = "sitesafety.detect_image:main"
cs-train-lidar = "sitesafety.lidar_detect:main"
cs-eval-lidar = "sitesafety.evaluate_lidar:main"
cs-ablate-lidar = "sitesafety.ablations:main"
cs-demo = "sitesafety.demo:main"
cs-plots = "sitesafety.plots:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "models", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
